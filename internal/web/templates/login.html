<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%235b8def'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<main class="login">
  <form method="post" action="/login" class="login-form">
    <h1>repo-man</h1>
    <p class="login-hint">This dashboard is gated by a passphrase.</p>
    {{if .Error}}<p class="login-error" role="alert">{{.Error}}</p>{{end}}
    <label for="passphrase">Passphrase</label>
    <input type="password" id="passphrase" name="passphrase" required autofocus
           autocomplete="current-password" autocapitalize="off" spellcheck="false">
    <input type="hidden" name="next" value="{{.Next}}">
    <button type="submit" class="btn btn--primary btn--wide">Sign in</button>
  </form>
</main>
</body>
</html>
